#
# The Android APK, built somewhere that is allowed to run hermesc.
#
# Hermes compiles the JavaScript to bytecode with hermesc.exe, an unsigned
# binary inside node_modules. The Windows machine this is developed on runs an
# Application Control policy that refuses to execute it, so a release build
# there either dies or has to fall back to JSC — which is a different engine,
# not a build flag, and not what should ship. A Linux runner has no such policy,
# so this is where a release APK comes from.
#
# Run it from the Actions tab, or let it run on a push to main. The APK comes
# out as an artifact on the run; download it and sideload it to a television.
#
name: Android APK

on:
  workflow_dispatch:
  push:
    # This branch too until it lands on main: workflow_dispatch only offers
    # itself once the file is on the default branch.
    branches: [main, safety-links-and-age-checks]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No setup-android step: the Ubuntu runner image already carries the
      # Android SDK with its licences accepted, and the action trips over
      # re-accepting them.

      # Git does not carry the executable bit on Windows checkouts.
      - name: Let gradlew run
        run: chmod +x android/gradlew

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: codera-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
