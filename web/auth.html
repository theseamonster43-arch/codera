<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Codera</title>
<meta name="robots" content="noindex">
<style>
  @font-face { font-family: 'Scoutie Sans'; src: url('/fonts/ScoutieSans-Bold.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'Scoutie Sans'; src: url('/fonts/ScoutieSans-Regular.ttf') format('truetype'); font-weight: 400; }
  :root { color-scheme: light dark; --bg: #f6f7f6; --card: #fff; --text: #0c120e; --muted: #56655b; --line: rgba(22, 101, 52, .14); }
  @media (prefers-color-scheme: dark) { :root { --bg: #070a08; --card: #0e1512; --text: #eef3ef; --muted: #7a8b7e; --line: rgba(34, 197, 94, .12); } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background: var(--bg); color: var(--text); font-family: 'Scoutie Sans', system-ui, sans-serif; }
  .box { width: 100%; max-width: 380px; text-align: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 32px 24px; }
  .mark { width: 62px; height: 62px; border-radius: 17px; margin: 0 auto 14px; display: grid; place-items: center;
    background: linear-gradient(135deg, #22c55e, #60a5fa); color: #fff; font-weight: 700; font-size: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; font-size: 14.5px; }
  button { width: 100%; height: 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font: inherit; font-weight: 700; font-size: 15.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
  button:disabled { opacity: .6; }
  .err { color: #ef4444; font-size: 13.5px; margin-top: 14px; }
</style>
</head>
<body>
<!--
  Signing in to the Codera apps with Google or GitHub.

  The desktop app and the Android app open this page in the real browser, where
  Google and GitHub can show their own sign-in. Once it's done, the page hands
  the sign-in (the provider's own token, never a password) back to the app
  through the codera:// link the app asked for, with the app's own \`state\`
  so the app can tell it's the answer to its question. The app then signs in to
  Firebase with it. The browser keeps no Codera session of its own.
-->
<div class="box">
  <div class="mark">&lt;/&gt;</div>
  <h1 id="title">Sign in to Codera</h1>
  <p id="lede">Continue in your browser, then you'll be taken back to the app.</p>
  <button id="go"></button>
  <div class="err" id="err" hidden></div>
</div>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
  import {
    getAuth, browserSessionPersistence, setPersistence, signInWithRedirect,
    getRedirectResult, signOut, GoogleAuthProvider, GithubAuthProvider,
  } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';

  const app = initializeApp({
    apiKey: 'AIzaSyAff6wCaEfD0jOrYI51xbqyXR3jGx6KEd4',
    authDomain: 'codera-46b86.firebaseapp.com',
    projectId: 'codera-46b86',
  }, 'handoff');
  const auth = getAuth(app);

  const q = new URLSearchParams(location.search);
  const provider = q.get('provider') === 'github' ? 'github' : 'google';
  const state = q.get('state') || '';
  // Only ever back to Codera's own app link.
  const back = 'codera://auth';

  const go = document.getElementById('go');
  const err = document.getElementById('err');
  const lede = document.getElementById('lede');
  const named = provider === 'github' ? 'GitHub' : 'Google';
  go.textContent = 'Continue with ' + named;
  document.getElementById('title').textContent = 'Signing in with ' + named;

  const stop = why => {
    lede.textContent = '';
    go.hidden = false;
    go.disabled = false;
    err.textContent = why;
    err.hidden = false;
  };

  if (!/^[A-Za-z0-9_-]{16,128}$/.test(state)) {
    go.hidden = true;
    stop('Open this from the Codera app.');
  } else {
    start();
  }

  /**
   * Straight to the provider, with no button to press first.
   *
   * A redirect rather than a popup, for two reasons: a popup needs a tap to
   * open at all, which is the extra step this page used to make people take;
   * and the sheet this runs in has no room to put a second window anywhere.
   * So the page arrives, hands over immediately, and the only screen anybody
   * sees is Google's or GitHub's own.
   */
  async function start() {
    go.hidden = true;
    lede.textContent = 'Taking you to ' + named + '…';
    try {
      // Kept for this sheet only, and signed out again below: the app is the
      // one being signed in, not this page.
      await setPersistence(auth, browserSessionPersistence);

      // Coming back from the provider, this is where the answer is waiting.
      const result = await getRedirectResult(auth);
      if (result) return hand(result);

      const p = provider === 'github' ? new GithubAuthProvider() : new GoogleAuthProvider();
      if (provider === 'github') p.addScope('user:email');
      await signInWithRedirect(auth, p);
    } catch (e) {
      said(e);
    }
  }

  async function hand(result) {
    const cred = provider === 'github'
      ? GithubAuthProvider.credentialFromResult(result)
      : GoogleAuthProvider.credentialFromResult(result);
    await signOut(auth);
    const out = new URLSearchParams({ provider, state });
    if (cred.idToken) out.set('idToken', cred.idToken);
    if (cred.accessToken) out.set('accessToken', cred.accessToken);
    lede.textContent = 'Signed in. Going back to Codera…';
    location.href = back + '?' + out.toString();
  }

  function said(e) {
    const code = e && e.code;
    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
      stop('That was closed before it finished.');
      return;
    }
    stop(code === 'auth/account-exists-with-different-credential'
      ? 'You already have a Codera account with that email. Sign in the way you did before.'
      : 'That didn’t work. Try again.');
  }

  // The button is only ever the way back from a failure.
  go.onclick = () => { err.hidden = true; start(); };
</script>
</body>
</html>
